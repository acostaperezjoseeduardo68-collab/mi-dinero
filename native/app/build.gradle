plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.midinero.app'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.midinero.app'
        minSdk 26
        targetSdk 36
        versionCode 22
        versionName '2.1.0'
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
