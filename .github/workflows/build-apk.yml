name: Build Mi Dinero APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Usar proyecto Android nativo
        shell: bash
        run: |
          set -euo pipefail
          test -f native/settings.gradle
          echo "ANDROID_PROJECT=$GITHUB_WORKSPACE/native" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          sed -i -E "s/compileSdk 37/compileSdk 36/; s/targetSdk 37/targetSdk 36/" app/build.gradle
          gradle --no-daemon assembleDebug

      - name: Sign APK with v1 and v2
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools/36.0.0" -maxdepth 1 -type f -name 'apksigner' -print -quit)"
          test -x "$APKSIGNER"

          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            "$APK"

          "$APKSIGNER" verify --verbose --min-sdk-version 26 "$APK"
          jarsigner -verify -verbose "$APK" >/tmp/jarsigner.txt 2>&1 || {
            cat /tmp/jarsigner.txt
            exit 1
          }

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -type f -path '*/app/build/outputs/apk/debug/app-debug.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK verificada correctamente."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiDinero-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
