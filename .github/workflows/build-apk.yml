name: Build Mi Dinero APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 2 -type f -name 'mi-dinero-android-proyecto*.zip' -print -quit)"
          if [ -z "$zip_file" ]; then
            echo "No se encontró el ZIP del proyecto Android."
            exit 1
          fi
          echo "Usando: $zip_file"
          unzip -q "$zip_file"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(find . -maxdepth 4 -type f -name 'settings.gradle' -path '*/mi-dinero-android/*' -print -quit)"
          if [ -n "$candidate" ]; then
            project_dir="$(dirname "$candidate")"
            echo "ANDROID_PROJECT=$project_dir" >> "$GITHUB_ENV"
            echo "Proyecto Android: $project_dir"
          else
            echo "No se encontró settings.gradle del proyecto Android."
            find . -maxdepth 5 -type f | head -250
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager."
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          sed -i -E "s/compileSdk 37/compileSdk 36/; s/targetSdk 37/targetSdk 36/" app/build.gradle
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiDinero-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
