name: Build Mi Dinero APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 2 -type f -name 'mi-dinero-android-proyecto*.zip' -print -quit)"
          if [ -z "$zip_file" ]; then
            echo "No se encontró el ZIP del proyecto Android."
            exit 1
          fi
          echo "Usando: $zip_file"
          unzip -q "$zip_file"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "mi-dinero-android" ]; then
            echo "ANDROID_PROJECT=mi-dinero-android" >> "$GITHUB_ENV"
          elif [ -d "mi-dinero-android/mi-dinero-android" ]; then
            echo "ANDROID_PROJECT=mi-dinero-android/mi-dinero-android" >> "$GITHUB_ENV"
          else
            echo "No se encontró la carpeta mi-dinero-android."
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiDinero-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
