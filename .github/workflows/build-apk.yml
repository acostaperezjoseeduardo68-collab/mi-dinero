s = s.replace("let movementType = 'income';", "let movementType = 'income';\nlet selectedRateDate = null;\nlet lastHistoryFetchAt = 0;\nlet lastRateFetchAt = 0;", 1)

helpers = r"""
function localDateKey(value){
  const s=String(value||'').trim();
  let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if(m)return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  return '';
}
function recordRateHistory(record){
  if(!record?.USD||!record?.date)return;
  state.rateHistory=Array.isArray(state.rateHistory)?state.rateHistory:[];
  const clean={date:record.date,USD:Number(record.USD),updated_at:record.updated_at||null,effective_date:record.effective_date||record.date};
  const idx=state.rateHistory.findIndex(x=>x.date===clean.date);
  if(idx>=0)state.rateHistory[idx]={...state.rateHistory[idx],...clean};
  else state.rateHistory.push(clean);
  state.rateHistory.sort((a,b)=>b.date.localeCompare(a.date));
  state.rateHistory=state.rateHistory.slice(0,1830);
}
function formatRateDate(date){return date?new Intl.DateTimeFormat('es-VE',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(date+'T12:00:00')):'—';}
function rateDelta(rec,list){
  if(!rec)return {kind:'flat',text:'—'};
  const older=list.filter(x=>x.date<rec.date)[0];
  if(!older||!older.USD)return {kind:'flat',text:'Sin día anterior'};
  const diff=rec.USD-Number(older.USD);
  const pct=(diff/Number(older.USD))*100;
  if(Math.abs(diff)<0.0000001)return {kind:'flat',text:'0,00%'};
  const sign=diff>0?'▲':'▼';
  return {kind:diff>0?'up':'down',text:sign+' '+Math.abs(diff).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:4})+' Bs ('+Math.abs(pct).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})+'%)'};
}
function renderRateHistory(){
  const list=[...(state.rateHistory||[])].filter(x=>x&&x.date&&Number(x.USD)>0).sort((a,b)=>b.date.localeCompare(a.date));
  const select=document.getElementById('rateHistorySelect');
  const summary=document.getElementById('rateHistorySummary');
  const detail=document.getElementById('rateHistoryDetail');
  const chart=document.getElementById('rateHistoryChart');
  if(!select||!summary||!detail||!chart)return;
  if(!list.length){
    select.innerHTML='';
    summary.textContent='Sin datos';
    detail.innerHTML='<div class="rate-history-empty">Todavía no hay histórico guardado. Con una conexión, la app cargará los datos anteriores y seguirá guardando las nuevas tasas automáticamente.</div>';
    chart.innerHTML='';
    return;
  }
  const currentDate=localDateKey(state.rate?.date)||list[0].date;
  if(!selectedRateDate||!list.some(x=>x.date===selectedRateDate))selectedRateDate=currentDate&&list.some(x=>x.date===currentDate)?currentDate:list[0].date;
  select.innerHTML=list.slice(0,90).map(x=>'<option value="'+x.date+'" '+(x.date===selectedRateDate?'selected':'')+'>'+formatRateDate(x.date)+' · '+Number(x.USD).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:4})+' Bs</option>').join('');
  summary.textContent=list.length.toLocaleString('es-VE')+' día'+(list.length===1?'':'s')+' disponible'+(list.length===1?'':'s');
  const rec=list.find(x=>x.date===selectedRateDate)||list[0];
  const delta=rateDelta(rec,list);
  detail.innerHTML='<div class="rate-detail-box"><span class="field-hint">Tasa del '+formatRateDate(rec.date)+'</span><strong>'+Number(rec.USD).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:4})+' Bs</strong><small>1 USD = '+Number(rec.USD).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:4})+' Bs</small></div><div class="rate-detail-box"><span class="field-hint">Variación vs. día anterior</span><strong class="rate-delta-'+delta.kind+'">'+delta.text+'</strong><small>'+(rec.effective_date&&rec.effective_date!==rec.date?'Vigencia BCV: '+formatRateDate(rec.effective_date):'Dato histórico diario')+'</small></div>';
  const chartList=list.slice(0,14).reverse();
  const min=Math.min(...chartList.map(x=>Number(x.USD)));
  const max=Math.max(...chartList.map(x=>Number(x.USD)));
  const span=Math.max(max-min,0.0001);
  chart.innerHTML=chartList.map(x=>{
    const pct=18+((Number(x.USD)-min)/span)*82;
    return '<div class="rate-chart-row"><div class="rate-chart-date">'+formatRateDate(x.date)+'</div><div class="rate-chart-bar" style="width:'+pct+'%"></div><div class="rate-chart-value">'+Number(x.USD).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div></div>';
  }).join('');
}
function selectRateHistory(date){selectedRateDate=date;renderRateHistory();}
async function fetchRateHistory(manual=false){
  const now=Date.now();
  if(!manual&&now-lastHistoryFetchAt<60*60*1000&&state.rateHistory?.length)return;
  try{
    const r=await fetch('https://bcv.today/api/v1/history.json',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const rows=Array.isArray(data)?data:(Array.isArray(data?.history)?data.history:(Array.isArray(data?.data)?data.data:[]));
    for(const row of rows){
      const date=localDateKey(row?.date||row?.effective_date);
      const usd=Number(row?.USD||row?.usd||0);
      if(date&&usd>0)recordRateHistory({date,USD:usd,updated_at:row?.updated_at||null,effective_date:localDateKey(row?.effective_date)||date});
    }
    lastHistoryFetchAt=Date.now();
    localStorage.setItem(STORAGE,JSON.stringify(state));
    renderRateHistory();
    if(manual)showToast('Histórico BCV actualizado');
  }catch(err){
    renderRateHistory();
    if(manual)showToast('No se pudo actualizar el histórico');
  }
}
"""
s = s.replace("async function fetchRate(manual=false){", helpers + "\nasync function fetchRate(manual=false){", 1)

old_fetch = """async function fetchRate(manual=false){const status=document.getElementById('rateStatus');status.textContent='Actualizando…';try{const r=await fetch(BCV_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.USD)throw new Error('Sin USD');currentRate=Number(data.USD);state.rate={USD:currentRate,date:data.date||null,updated_at:data.updated_at||null};saveState();status.textContent='Actualizada';if(manual)showToast('Tasa BCV actualizada');}catch(err){currentRate=Number(state.rate?.USD||currentRate||0);status.textContent=currentRate?'Último valor guardado':'Sin conexión';if(manual)showToast('No se pudo actualizar la tasa');}updateRateUI();updateConversion();}"""
new_fetch = """async function fetchRate(manual=false){const status=document.getElementById('rateStatus');status.textContent='Actualizando…';lastRateFetchAt=Date.now();try{const r=await fetch(BCV_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.USD)throw new Error('Sin USD');currentRate=Number(data.USD);const date=localDateKey(data.date||data.effective_date)||new Date().toISOString().slice(0,10);state.rate={USD:currentRate,date,updated_at:data.updated_at||null,effective_date:data.effective_date||date};recordRateHistory({date,USD:currentRate,updated_at:data.updated_at||null,effective_date:localDateKey(data.effective_date)||date});saveState();status.textContent='Actualizada';if(manual)showToast('Tasa BCV actualizada');}catch(err){currentRate=Number(state.rate?.USD||currentRate||0);status.textContent=currentRate?'Último valor guardado':'Sin conexión';if(manual)showToast('No se pudo actualizar la tasa');}updateRateUI();updateConversion();renderRateHistory();fetchRateHistory(false);}"""
assert old_fetch in s
s = s.replace(old_fetch,new_fetch,1)
assert "renderCategories();renderThemes();renderProfile();updateConversion();updateRateUI();}" in s
s = s.replace("renderCategories();renderThemes();renderProfile();updateConversion();updateRateUI();}", "renderCategories();renderThemes();renderProfile();updateConversion();updateRateUI();renderRateHistory();}", 1)
s = s.replace("state=defaultState();currentRate=0;render();fetchRate(false);showToast('App reiniciada');", "state=defaultState();currentRate=0;selectedRateDate=null;lastHistoryFetchAt=0;render();fetchRate(false);fetchRateHistory(true);showToast('App reiniciada');", 1)
s = s.replace("render();\nfetchRate(false);\nsetInterval(()=>fetchRate(false),5*60*1000);", "render();\nfetchRate(false);\nfetchRateHistory(false);\nsetInterval(()=>fetchRate(false),5*60*1000);\ndocument.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastRateFetchAt>60*1000)fetchRate(false);});", 1)

path.write_text(s, encoding="utf-8")
PY

          echo "Historial BCV agregado a: $INDEX_HTML"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          sed -i -E "s/compileSdk 37/compileSdk 36/; s/targetSdk 37/targetSdk 36/" app/build.gradle
          gradle --no-daemon assembleDebug

      - name: Sign APK with v1 and v2
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools/36.0.0" -maxdepth 1 -type f -name 'apksigner' -print -quit)"
          test -x "$APKSIGNER"

          mkdir -p "$HOME/.android"
          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            "$APK"

          "$APKSIGNER" verify --verbose --min-sdk-version 26 "$APK"
          jarsigner -verify -verbose "$APK" >/tmp/jarsigner.txt 2>&1 || {
            cat /tmp/jarsigner.txt
            exit 1
          }

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -type f -path '*/app/build/outputs/apk/debug/app-debug.apk' -print -quit)"
          test -n "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK verificada correctamente."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiDinero-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
